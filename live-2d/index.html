<!DOCTYPE html>
<html>

<head>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Live2D desktop pet and voice chat</title>
</head>

<body>
    <div id="live2d-container" class="avatar-container">
        <canvas id="canvas"></canvas>
    </div>
    <div id="vrm-container" class="avatar-container" style="display: none;">
        <canvas id="vrm-canvas"></canvas>
    </div>
    <div id="avatar-transition" aria-hidden="true">
        <div class="avatar-transition-spinner"></div>
    </div>
    <div id="subtitle-container">
        <div id="subtitle-confirm-btn">OK</div>
        <p id="subtitle-text"></p>
    </div>

    <!-- VRM模型控制面板（展开式） -->
    <div id="model-controls">
        <div id="panel-buttons">
            <div id="btn-toggle-gaze" class="ctrl-btn" title="Eyes follow the mouse">👀</div>
            <div id="btn-toggle-render" class="ctrl-btn" title="Turn off VRM rendering (needs VMC on)">👁</div>
            <div id="btn-toggle-vmc" class="ctrl-btn" title="VMC data sending on/off">📡</div>
            <div id="btn-reset-position" class="ctrl-btn" title="Reset camera view">↺</div>
            <div id="btn-click-through" class="ctrl-btn" title="Click-through (the model does not catch the mouse)">🖱</div>
        </div>
        <div id="btn-toggle-panel" class="ctrl-btn" title="Show controls">⚙</div>
    </div>

    <div id="text-chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <div class="chat-input-frame">
                <div id="chat-input" contenteditable="true" role="textbox" aria-label="Type a message"></div>
                <span class="chat-input-label">Type a message, press Enter to send</span>
                <span class="chat-input-topline"></span>
                <span class="chat-input-underline"></span>
            </div>
            <button id="chat-send-btn" type="button" hidden aria-hidden="true" tabindex="-1">Send</button>
        </div>
    </div>

    <!-- 歌词气泡容器 -->
    <div id="lyrics-bubble-container">
        <div id="lyrics-bubble-text"></div>
    </div>

    <!-- 气泡框容器 -->
    <div id="bubble-container">
        <div id="bubble-text"></div>
    </div>

    <!-- 工具调用气泡框堆叠容器 -->
    <div id="tool-bubbles-container"></div>

    <!-- 快捷设置面板 -->
    <div id="quick-settings">
        <div id="quick-settings-items">
            <div class="quick-item" id="btn-toggle-chat">💬 Text box</div>
            <div class="quick-item" id="btn-toggle-mode">Push-to-talk (V key)</div>
        </div>
        <div id="quick-gear" title="Quick menu">⚙</div>
    </div>

    <!-- 上游 PIXI 6 + pixi-live2d-display 运行时 -->
    <script src="libs/live2d.min.js"></script>
    <script src="libs/live2dcubismcore.min.js"></script>
    <script src="libs/pixi.min.js"></script>
    <script src="libs/pixi-live2d-display.min.js"></script>
    <script src="libs/pixi-live2d-display-extra.min.js"></script>
    <script src="app.js"></script>


</body>

</html>
